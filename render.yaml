databases:
  - name: sistema-moeda-estudantil-db
    databaseName: moeda_estudantil
    user: moeda
    plan: free
    region: ohio

services:
  - type: web
    name: sistema-moeda-estudantil-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-moeda-estudantil-db
          property: connectionString
