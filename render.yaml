databases:
  - name: sistema-moeda-estudantil-db
    databaseName: moeda_estudantil
    user: moeda
    plan: free
    region: ohio

services:
  - type: web
    name: sistema-moeda-estudantil-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-moeda-estudantil-db
          property: connectionString
      - key: SEED_DEMO_ACCOUNTS
        sync: false
      - key: SEED_DEMO_STUDENT_EMAIL
        sync: false
      - key: SEED_DEMO_STUDENT_PASSWORD
        sync: false
      - key: SEED_DEMO_STUDENT_NAME
        sync: false
      - key: SEED_DEMO_STUDENT_CPF
        sync: false
      - key: SEED_DEMO_STUDENT_RG
        sync: false
      - key: SEED_DEMO_STUDENT_ADDRESS
        sync: false
      - key: SEED_DEMO_STUDENT_COURSE
        sync: false
      - key: SEED_DEMO_PROFESSOR_EMAIL
        sync: false
      - key: SEED_DEMO_PROFESSOR_PASSWORD
        sync: false
      - key: SEED_DEMO_PROFESSOR_NAME
        sync: false
      - key: SEED_DEMO_PROFESSOR_CPF
        sync: false
      - key: SEED_DEMO_PROFESSOR_DEPARTMENT
        sync: false
      - key: SEED_DEMO_COMPANY_EMAIL
        sync: false
      - key: SEED_DEMO_COMPANY_PASSWORD
        sync: false
      - key: SEED_DEMO_COMPANY_NAME
        sync: false
