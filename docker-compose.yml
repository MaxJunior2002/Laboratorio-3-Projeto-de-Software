services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moeda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moeda_dev}
      POSTGRES_DB: ${POSTGRES_DB:-moeda_estudantil}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-moeda} -d ${POSTGRES_DB:-moeda_estudantil}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
